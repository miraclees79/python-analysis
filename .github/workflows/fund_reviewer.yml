name: Weekly Fund Review

on:
  schedule:
    # Uruchamia się w  piątki o 23:00 UTC
    - cron: '0 23 * * 5'
  workflow_dispatch:
    inputs:
      use_gemini:
        description: 'Użyj GEMINI_API_KEY do benchmarków nierozpoznanych i proxy kategorii'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fund-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4



      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh KNF & Generate Ranking
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BULK_MODEL: ${{ vars.GEMINI_BULK_MODEL || 'gemini-3.5-flash-lite' }}
          GEMINI_REVIEW_MODEL: ${{ vars.GEMINI_REVIEW_MODEL || 'gemini-3.8-flash' }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-3.1-flash-lite' }}
          GEMINI_BATCH_SIZE: ${{ vars.GEMINI_BATCH_SIZE || '25' }}
          USE_GEMINI: ${{ inputs.use_gemini }}
        run: |
          echo "$GOOGLE_CREDENTIALS" > /tmp/credentials.json
          GEMINI_FLAG=""
          if [ "$USE_GEMINI" = "true" ] && [ -n "$GEMINI_API_KEY" ]; then
            GEMINI_FLAG="--use-gemini"
          elif [ "$USE_GEMINI" = "true" ]; then
            echo "::warning::Gemini requested but GEMINI_API_KEY is not configured."
          fi

          # 2. Następnie odpalamy rewizję funduszy z flagą --update (dociągnie KNF i wygeneruje raporty)
          python moj_system/scripts/fund_reviewer.py --update $GEMINI_FLAG

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fund-review-logs
          path: |
            outputs/fund_ranking_*.csv
            outputs/fund_benchmark_review_*.csv
