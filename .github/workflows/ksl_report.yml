name: Daily KSL Report

on:
  schedule:
    # Po odświeżeniu funduszy (20:11 UTC), OCR PPE (21:23 UTC) i strategii (23:17 UTC)
    - cron: '51 0 * * *'  
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ksl-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and send KSL report
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          KSL_DATA_DIR: ${{ runner.temp }}/ksl_data
        run: |
          echo "$GOOGLE_CREDENTIALS" > /tmp/credentials.json
          python -m moj_system.scripts.ksl_report
