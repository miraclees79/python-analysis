name: Daily Strategy Sweep

on:

  workflow_dispatch:  # Pozwala odpalić ręcznie
  schedule:
    # Uruchamia się codziennie o 02:00 UTC (po OCR PPE z 00:00 UTC)
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: daily-strategy
  cancel-in-progress: false

jobs:
  run-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        asset: [WIG20TR, PENSION, GLOBAL_B, GLOBAL_CRYPTO] 
        # all possible assets: [WIG20TR, MWIG40TR, SWIG80TR, SP500, STOXX600, PENSION, GLOBAL_A, GLOBAL_B, GLOBAL_CRYPTO]
    steps:
      - uses: actions/checkout@v4

      # 1. Instalacja systemowych zależności potrzebnych dla OCR i renderowania wykresów
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-pol poppler-utils libgl1-mesa-dev
      
      # 2. Instalacja zależności Pythona
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 3. Uruchomienie Runnera
      - name: Run Strategy
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          
        run: |
          # Zapisz credentials do pliku (wymagane przez GDriveClient)
          echo "$GOOGLE_CREDENTIALS" > /tmp/credentials.json
          python -m moj_system.scripts.daily_runner --asset ${{ matrix.asset }} ${{ matrix.asset == 'PENSION' && '--email' || '' }}

      # 4. Archiwizacja wyników
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.asset }}
          path: outputs/
